<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabletop DM - Game Console</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <div class="top-bar">
            <h1>TABLETOP DM</h1>
            <a href="/control" class="control-link">Control Plane</a>
            <a href="/help" class="control-link" title="Help & Documentation">Help</a>
            <span id="campaignName" class="campaign-name">Loading...</span>
            <span id="modeBadge" class="mode-badge">---</span>
            <div class="principal-info">
                <span id="principalName" class="principal-name">--</span>
                <span id="sessionIndicator" class="session-indicator" title="Session status"></span>
            </div>
            <div id="connIndicator" class="connection-indicator" title="WebSocket status"></div>
        </div>

        <div class="sidebar">
            <div class="sidebar-section story-state-board">
                <h3>Story State</h3>
                <div class="story-state-item">
                    <span class="story-label">Location:</span>
                    <span id="currentLocation" class="story-value">--</span>
                </div>
                <div class="story-state-item">
                    <span class="story-label">Time:</span>
                    <span id="gameTime" class="story-value">--</span>
                </div>
                <div class="story-state-summary" id="storyStateSummary"></div>
            </div>
            <div class="sidebar-section">
                <h3>Entities</h3>
            </div>
            <div id="entityList" class="entity-list"></div>
        </div>

        <div class="main-content">
            <div class="tabs">
                <button class="tab active" data-tab="feed" onclick="App.showTab('feed')">Event Feed</button>
                <button class="tab" data-tab="map" onclick="App.showTab('map')">Map</button>
            </div>

            <div id="tab-feed" class="tab-content active">
                <div id="eventFeed" class="event-feed">
                    <div class="event-item system">
                        <span class="timestamp"></span>
                        Welcome to Tabletop DM. Type <strong>/help</strong> for available commands.
                    </div>
                </div>
            </div>

            <div id="tab-map" class="tab-content">
                <div class="map-container">
                    <canvas id="mapCanvas" class="map-canvas"></canvas>
                    <div class="map-hint" id="mapHint">Select an entity, then click to move</div>
                    <div class="map-controls">
                        <button onclick="App.renderMap()" title="Refresh map">&#8635;</button>
                    </div>
                </div>
            </div>

            <div class="command-area">
                <div class="command-input-wrapper">
                    <input type="text" id="commandInput" class="command-input"
                           placeholder="Type a message or /command..." autocomplete="off">
                    <button class="btn btn-primary" onclick="App.submitCommand()">Send</button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="detail-panel" id="entityDetail">
                <div class="empty-state">
                    <div class="icon">&#9876;</div>
                    <p>Select an entity to view details</p>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>Encounter</h3>
                <select id="encounterSelect" class="encounter-select"
                        onchange="App.selectEncounter(this.value)">
                    <option value="">No Encounter</option>
                </select>
            </div>

            <div class="sidebar-section">
                <h3>Initiative</h3>
                <div id="initiativeList"></div>
            </div>

            <div class="quick-actions">
                <h4>Quick Actions</h4>
                <button class="action-btn" onclick="App.rollDice()">Roll d20</button>
                <button class="action-btn combat-btn" onclick="App.quickAttack()" title="Attack selected target">Attack Target</button>
                <button class="action-btn combat-btn" onclick="App.quickEndTurn()" title="End your turn">End Turn</button>
                <button class="action-btn" onclick="App.advanceTurn()">Advance Initiative</button>
                <button class="action-btn" onclick="App.requestNarration()">AI Narration</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
