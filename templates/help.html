<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableTop DM - Help & Wiki</title>
    <link rel="stylesheet" href="/static/css/help.css">
</head>
<body>
    <div class="help-layout">
        <header class="help-header">
            <h1>TableTop DM</h1>
            <nav class="header-nav">
                <a href="/">Dashboard</a>
                <a href="/game">Game Console</a>
                <a href="/control">Control Plane</a>
                <a href="/help" class="active">Help & Wiki</a>
            </nav>
        </header>

        <aside class="help-sidebar">
            <h2>Documentation</h2>
            <nav class="wiki-nav">
                {% for page in pages %}
                <a href="/help/{{ page.name }}" class="{% if page.active %}active{% endif %}">
                    {{ page.title }}
                </a>
                {% endfor %}
            </nav>

            <div class="quick-links">
                <h3>Quick Links</h3>
                <a href="/help/quickstart">Quick Start</a>
                <a href="/help/commands">Commands</a>
                <a href="/help/game-console">Game Console</a>
                <a href="/help/control-plane">Control Plane</a>
            </div>
        </aside>

        <main class="help-content">
            <article class="wiki-article">
                {{ content | safe }}
            </article>

            <footer class="help-footer">
                <p>
                    <a href="/help">Back to Index</a> |
                    <a href="https://github.com/your-repo/TableTop_DM" target="_blank">GitHub</a>
                </p>
            </footer>
        </main>
    </div>
</body>
</html>
