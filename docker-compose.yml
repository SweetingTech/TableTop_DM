services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tabletop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tabletop_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tabletop_dm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tabletop} -d ${POSTGRES_DB:-tabletop_dm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tabletop}:${POSTGRES_PASSWORD:-tabletop_dev_password}@postgres:5432/${POSTGRES_DB:-tabletop_dm}
      APP_ENV: ${APP_ENV:-development}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
