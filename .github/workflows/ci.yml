name: ci

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  ci-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TTDM_LLM_MODE: mock
      TTDM_RNG_SEED: "1337"
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Write .env
        run: |
          cat > .env <<EOF_ENV
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=tabletop_dm
          POSTGRES_PORT=5432
          REDIS_PASSWORD=redispass
          REDIS_PORT=6379
          QDRANT_HTTP_PORT=6333
          QDRANT_GRPC_PORT=6334
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/tabletop_dm
          EOF_ENV

      - name: Optional compose smoke (runtime-gated)
        run: |
          if bash scripts/docker_runtime_available.sh; then
            docker compose -f infra/docker-compose.yml up -d
            bash infra/scripts/compose_smoke.sh
          else
            echo "[workflow] Docker runtime unavailable; skipping pre-ci compose smoke"
          fi

      - name: Integration gate
        run: make ci-integration

      - name: CI pipeline
        run: make ci

      - name: Verify docker mode
        run: make verify-docker

      - name: Verify local mode
        run: make verify-local

      - name: Tear down
        if: always()
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker compose -f infra/docker-compose.yml down --remove-orphans || true
          fi
