name: ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: read

jobs:
  lint-type-unit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dev tooling
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: make lint

      - name: Format check
        run: make format

      - name: Typecheck
        run: make typecheck

      - name: Unit + contracts
        run: pytest tests -m "not integration" --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=50

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration-compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint-type-unit-contracts]
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tabletop_dm
      POSTGRES_PORT: "5432"
      REDIS_PASSWORD: redispass
      REDIS_PORT: "6379"
      QDRANT_HTTP_PORT: "6333"
      QDRANT_GRPC_PORT: "6334"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tabletop_dm
    steps:
      - uses: actions/checkout@v5

      - name: Start dependencies
        run: |
          docker compose -f infra/docker-compose.yml up -d
          docker compose -f infra/docker-compose.yml ps

      - name: Compose smoke
        run: bash infra/scripts/compose_smoke.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt

      - name: Migrate + seed
        run: |
          bash infra/scripts/migrate.sh
          bash infra/scripts/seed_demo.sh

      - name: Run integration tests
        run: pytest tests -m "integration" -q

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color

      - name: Shutdown
        if: always()
        run: docker compose -f infra/docker-compose.yml down --volumes --remove-orphans

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-type-unit-contracts]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-push:
    runs-on: ubuntu-latest
    needs: [lint-type-unit-contracts, integration-compose-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
