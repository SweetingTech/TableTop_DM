name: e2e

on:
  pull_request:
    paths:
      - "kernel/**"
      - "persona/**"
      - "cognition/**"
      - "population/**"
      - "experiments/**"
      - "domains/**"
      - "frontend/**"
      - "infra/**"
      - "scripts/**"
      - "tests/e2e/**"
      - "main.py"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/e2e.yml"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TTDM_BASE_URL: http://127.0.0.1:8000
      TTDM_LLM_MODE: mock
      TTDM_RNG_SEED: "1337"
      TTDM_OPERATOR_TOKEN: e2e-operator
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install tests and Chromium
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium
      - name: Build and start the full v2 stack
        run: docker compose --env-file .env.example -f infra/docker-compose.yml up -d --build app worker
      - name: Wait for dependency-aware readiness
        run: uv run python scripts/wait_ready.py --url http://127.0.0.1:8000/readyz --timeout 180
      - name: Run user-level journeys
        run: uv run pytest -m e2e tests/e2e -v
      - name: Capture stack logs
        if: failure()
        run: docker compose --env-file .env.example -f infra/docker-compose.yml logs --no-color > stack-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-and-stack-artifacts
          path: |
            test-results-e2e/
            stack-logs.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-backend-release-screenshots
          path: test-results-e2e/release-screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down
        if: always()
        run: docker compose --env-file .env.example -f infra/docker-compose.yml down --volumes --remove-orphans
