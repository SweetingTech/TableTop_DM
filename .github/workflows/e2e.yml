name: e2e

on:
  pull_request:
    paths:
      - "templates/**"
      - "static/**"
      - "app.py"
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"
      - "requirements-dev.txt"
      - "pyproject.toml"
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TTDM_LLM_MODE: mock
      TTDM_RNG_SEED: "1337"
      TTDM_BASE_URL: "http://localhost:8000"
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Write .env
        run: |
          cat > .env <<EOF_ENV
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=tabletop_dm
          POSTGRES_PORT=5432
          REDIS_PASSWORD=redispass
          REDIS_PORT=6379
          QDRANT_HTTP_PORT=6333
          QDRANT_GRPC_PORT=6334
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/tabletop_dm
          EOF_ENV

      - name: Export .env to workflow env
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: make install

      - name: Install Playwright browser (chromium + system deps)
        run: python -m playwright install --with-deps chromium

      - name: Boot infra (postgres/redis/qdrant) and migrate/seed
        run: |
          docker compose -f infra/docker-compose.yml up -d postgres redis qdrant
          bash infra/scripts/migrate.sh
          bash infra/scripts/seed_demo.sh

      - name: Start app server
        run: |
          mkdir -p burn-bag
          PORT=8000 PYTHONUNBUFFERED=1 nohup python app.py > burn-bag/app.log 2>&1 &
          echo $! > burn-bag/app.pid

      - name: Wait for app /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "App ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App did not become ready in 60s"
          tail -n 200 burn-bag/app.log || true
          exit 1

      - name: Run Playwright e2e suite
        run: pytest -m "e2e" tests/e2e -v

      - name: Upload Playwright artifacts (videos / screenshots / traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results-e2e/
            burn-bag/app.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop app server
        if: always()
        run: |
          if [ -f burn-bag/app.pid ]; then
            kill "$(cat burn-bag/app.pid)" 2>/dev/null || true
          fi

      - name: Tear down infra
        if: always()
        run: docker compose -f infra/docker-compose.yml down --remove-orphans -v || true
