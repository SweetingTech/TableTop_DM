[project]
name = "tabletop-dm"
version = "2.0.0"
description = "A deterministic, local-first tabletop simulation kernel and scenario lab"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=25.1.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.2",
    "redis>=5.2.0",
    "rq>=2.6.0",
    "duckdb>=1.3.2",
    "pyarrow>=21.0.0",
]

[project.scripts]
tabletop-dm = "main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "kernel*",
    "persona*",
    "cognition*",
    "population*",
    "experiments*",
    "domains*",
    "infra*",
    "static*",
]

[tool.setuptools.package-data]
persona = [
    "schema/core/*.yaml",
    "schema/world/*.yaml",
    "schema/tabletop/*.yaml",
    "schema/accessibility/*.yaml",
]
infra = ["sql/migrations/*.sql"]
static = ["v2/index.html", "v2/assets/*"]

[dependency-groups]
dev = [
    "diff-cover>=9.2.4",
    "httpx>=0.28.1",
    "jsonschema>=4.23.0",
    "mypy>=1.11.2",
    "playwright>=1.59.0",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-playwright>=0.7.2",
    "requests>=2.32.3",
    "ruff>=0.6.2",
    "types-redis>=4.6.0.20241004",
    "types-requests>=2.32.0.20241016",
    "types-psycopg2>=2.9.21.20241019",
    "types-PyYAML>=6.0.12.20241230",
]



[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
markers = [
  "unit: fast deterministic unit tests",
  "contracts: schema/contract tests (jsonschema/pydantic consistency)",
  "integration: tests requiring docker compose dependencies",
  "slow: long-running tests",
  "e2e: Playwright browser tests requiring a running app server (opt-in via -m e2e)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
